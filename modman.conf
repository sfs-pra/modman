# ==========================================
# Конфигурационный файл modman
# ==========================================

# Директория для скачивания .pfs модулей.
# По умолчанию (если переменная не задана) modman автоопределит через
# `pfs --download-dir`. Для rootaufs2 это /mnt/home/${dir}/optional,
# где ${dir} из /proc/cmdline. Раскомментируй ОДНУ строку ниже для явного пути:
#DOWNLOAD_DIR="/home/ai/modman/modules"
#DOWNLOAD_DIR="/home/live/Загрузки"

# Каталог локального кэша (db.txt + dependencies.txt создаются внутри него).
# Если оставить пустым — modman берёт /var/cache/modman.
# Legacy: если задать вместо этого старый CACHE_FILE="/path/to/db.txt",
# modman возьмёт его parent-каталог как CACHE_DIR (для обратной совместимости).
CACHE_DIR="/var/cache/modman"

# Постоянное состояние modman, которое не должно очищаться как cache.
# Чёрный список обновлений по умолчанию хранится здесь:
#   ${MODMAN_STATE_DIR}/update-blacklist.tsv
MODMAN_STATE_DIR="/var/lib/modman"

# Системные утилиты
CMD_LOAD="pfsload"
CMD_UNLOAD="pfsunload"

# Префикс initrd модулей (определяет "До" vs "После" в --list-loaded).
# По умолчанию (если переменная не задана) modman автоопределит через
# `pfs --aufs-initrd-prefix`:
#   rootaufs2 (mkinitcpio): /run/archroot/live/memory/images
#   uird/livekit/porteus:   ${SYSMNT}/bundles
# Раскомментируй ОДНУ строку ниже для явного пути:
#AUFS_INITRD_PREFIX="/run/archroot/live/memory/images"

# Зависимости, которые modman должен пропускать при resolve.
# Используйте если deps уже включены в base-модуль дистрибутива (например,
# 030-* и 040-* группы часто бандлятся в 001-zz). Пробело-разделённые
# glob-паттерны (поддерживается shell-glob: *, ?, []).
# По умолчанию (если переменная не задана) пропусков нет.
# Раскомментируй ОДНУ строку ниже и подправь под свой дистрибутив:
#MODMAN_IGNORE_DEPS="030-gtk3"                  # пропустить ровно один
#MODMAN_IGNORE_DEPS="030-gtk3 040-extras"       # пропустить два конкретных
#MODMAN_IGNORE_DEPS="030-* 040-*"               # пропустить группу по префиксу

# Расширение файлов модулей (без ведущей точки).
# Меняется только при использовании альтернативного формата контейнера.
# По умолчанию — pfs (PuppyRus filesystem).
EXT="pfs"
AUFS_SYSTEM_PATH="/mnt/."

# Стиль CLI: "pacman" или "apt"
CLI_STYLE="pacman"

# ==========================================
# Автопроверка обновлений при входе в систему
# ==========================================

# Включить проверку обновлений при входе (через modman-update-check).
# 1 — включено (по умолчанию), 0 — отключено.
UPDATE_CHECK_ON_LOGIN=1

# Открывать modman-gui --updates при обнаружении обновлений.
# 0 — только уведомление через notify-send (по умолчанию).
# 1 — дополнительно открыть GUI с вкладкой обновлений.
UPDATE_CHECK_OPEN_GUI=0

# Репозитории ( # - закомментировать, несколько через пробел)
REPO_URLS=(
    "http://mirror.yandex.ru/puppyrus/puppyrus-a64/pfs-portable"
    #"http://another.repo.com/pfs"
    #"http://third.repo.com/modules"
)

# Разделитель в индексе (по умолчанию табуляция для удобства парсинга)
IFS_SEP=$'\t'

# Команды для пунктов "Подключить в..." в правом меню GUI.
# Если ключ задан — соответствующий пункт виден в правом меню; при клике
# выполняется указанная команда вместо стандартного CMD_LOAD. Значение —
# полная команда с флагами; путь к .pfs добавляется как последний аргумент.
# Если пусто или закомментирован — пункт скрыт.
#
# ВНИМАНИЕ: команда разбивается по пробелам (shell word-splitting). Пути
# с пробелами в значении НЕ поддерживаются.
#
# Always-visible пункт "Подключить в верхний слой" использует CMD_LOAD без
# флагов (pfsload's встроенный default). Чтобы изменить — правьте CMD_LOAD.

# Команда для пункта "Подключить в нижний слой".
# По умолчанию: pfsload -l (закомментирован → пункт скрыт).
#PFSLOAD_ALLOW_LOWER="pfsload -l"

# Команда для пункта "Подключить в RAM".
# По умолчанию: pfsload -r (закомментирован → пункт скрыт).
#PFSLOAD_ALLOW_TORAM="pfsload -r"

# Команда для пункта "Подключить в нижний слой + RAM".
# По умолчанию: pfsload -l -r (закомментирован → пункт скрыт).
#PFSLOAD_ALLOW_LOWER_TORAM="pfsload -l -r"

# Команда для пункта "Подключить в верхний слой + RAM".
# По умолчанию: pfsload -u -r (закомментирован → пункт скрыт).
#PFSLOAD_ALLOW_UPPER_TORAM="pfsload -u -r"
